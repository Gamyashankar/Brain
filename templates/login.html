<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Brain Stroke AI</title>
    <style>
      :root {
        --accent: #2F7A73;
        --accent-dark: #24605A;
        --accent-light: #E7F2F1;
        --bg: #FAFAFA;
        --surface: #FFFFFF;
        --border: #E3E5E8;
        --text-primary: #1F2937;
        --text-secondary: #6B7280;
        --danger: #B3453D;
        --radius: 10px;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
        --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.06);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text-primary);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      h1, h2, h3, h4 {
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 12px 0;
      }

      p { line-height: 1.6; color: var(--text-secondary); }

      .login-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #FAFAFA 0%, #F1F4F3 100%);
        padding: 24px;
      }

      .login-card {
        width: 100%;
        max-width: 380px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 40px 36px;
        box-shadow: var(--shadow-md);
      }

      .login-card .brand-mark {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
      }

      .login-card .brand-mark .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
      }

      .login-card h1 {
        font-size: 19px;
        margin-bottom: 4px;
      }

      .login-card .subtitle {
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 26px;
      }

      .field { margin-bottom: 18px; }

      .field label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-primary);
        margin-bottom: 6px;
      }

      .field input {
        width: 100%;
        padding: 11px 13px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        background: #FCFCFC;
        color: var(--text-primary);
      }

      .field input:focus {
        outline: none;
        border-color: var(--accent);
        background: #fff;
        box-shadow: 0 0 0 3px var(--accent-light);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 22px;
        border-radius: 8px;
        border: none;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.05s ease;
      }

      .btn-primary {
        background: var(--accent);
        color: #fff;
      }

      .btn-primary:hover { background: var(--accent-dark); }
      .btn-block { width: 100%; }

      .error-banner {
        background: #FBEAE8;
        color: var(--danger);
        border: 1px solid #F0CFCB;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 18px;
      }

      .login-hint {
        margin-top: 20px;
        font-size: 12px;
        color: var(--text-secondary);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <div class="brand-mark">
          <span class="dot"></span>
          <h1>Brain Stroke AI</h1>
        </div>
        <p class="subtitle">Secure access to the diagnostic workspace.</p>
        {% if error %}
        <div class="error-banner">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required />
          </div>
          <button class="btn btn-primary btn-block" type="submit">Login</button>
        </form>
        <p class="login-hint">Demo credentials: admin / admin123</p>
      </div>
    </div>
  </body>
</html>
